<div class="form-shell" data-form-shell>
<form class="demo-form" data-demo-form action="/api/demo-requests" method="post" novalidate>
  <div class="field">
    <label for="f-name">Your name</label>
    <input id="f-name" name="name" type="text" autocomplete="name" maxlength="80" required>
    <p class="field-error" id="f-name-err" hidden></p>
  </div>
  <div class="field">
    <label for="f-phone">Mobile number</label>
    <div class="phone-input">
      <span aria-hidden="true">+91</span>
      <input id="f-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="14" placeholder="98765 43210" required>
    </div>
    <p class="field-error" id="f-phone-err" hidden></p>
  </div>
  <div class="field">
    <label for="f-clinic">Clinic name</label>
    <input id="f-clinic" name="clinic" type="text" autocomplete="organization" maxlength="120" required>
    <p class="field-error" id="f-clinic-err" hidden></p>
  </div>
  <div class="field">
    <label for="f-city">City</label>
    <input id="f-city" name="city" type="text" autocomplete="address-level2" maxlength="60" required>
    <p class="field-error" id="f-city-err" hidden></p>
  </div>
  <div class="hp" aria-hidden="true">
    <label for="f-rc-hp">Leave this empty</label>
    <input id="f-rc-hp" name="rc_hp" type="text" tabindex="-1" autocomplete="off">
  </div>
  <button class="btn btn-red btn-lg btn-block" type="submit" data-submit>Book my free demo</button>
  <p class="form-status" data-form-status role="alert" hidden></p>
  <p class="form-note">We'll call you {{site.callbackPromise}} to fix a time. <a href="/privacy/">Privacy</a></p>
</form>
<div class="form-done" data-form-done tabindex="-1" hidden>
  <h3 data-done-title>Thank you</h3>
  <p>We've got your request. We'll call you on <strong data-done-phone></strong> {{site.callbackPromise}} to fix a time for your demo.</p>
  <p class="muted small">Your reference: <span data-done-ref></span></p>
</div>
</div>
