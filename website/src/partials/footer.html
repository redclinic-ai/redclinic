<footer class="site-footer">
  <div class="wrap footer-row">
    <div>
      <img src="/assets/img/logo.svg" alt="RedClinic" width="112" height="25" loading="lazy">
      <p class="footer-line">AI for Modern Clinics</p>
    </div>
    <nav class="footer-links" aria-label="Contact">
      <a href="tel:{{site.phoneE164}}" data-track="call_click" data-loc="footer">{{site.phoneDisplay}}</a>
      <a href="https://wa.me/{{site.whatsappE164}}?text={{site.whatsappText}}" data-track="whatsapp_click" data-loc="footer" rel="noopener">WhatsApp</a>
      <a href="mailto:{{site.email}}" data-track="email_click" data-loc="footer">{{site.email}}</a>
      <a href="/privacy/">Privacy</a>
    </nav>
  </div>
  <p class="wrap footer-small">© 2026 RedClinic. Screens shown are previews of software in development.</p>
</footer>
<div class="sticky-cta" data-sticky-cta hidden>
  <a class="btn btn-red" href="/demo/" data-track="cta_click" data-loc="sticky">Book a free demo</a>
</div>
