<!DOCTYPE html>
<html lang="en-IN" data-preview="{{page.preview}}" data-analytics-endpoint="{{site.analytics.endpoint}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}">
<meta name="robots" content="{{page.robots}}">
<link rel="canonical" href="{{page.canonical}}">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/assets/img/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/img/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/icon-180.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/assets/fonts/instrument-sans-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/site.css">
<meta property="og:type" content="{{page.ogType}}">
<meta property="og:site_name" content="RedClinic">
<meta property="og:title" content="{{page.ogTitle}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:url" content="{{page.canonical}}">
<meta property="og:image" content="{{site.origin}}/assets/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="en_IN">
<meta name="twitter:card" content="summary_large_image">
{{page.jsonld}}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
{{> header}}
<main id="main">
{{page.body}}
</main>
{{> footer}}
<script src="/assets/js/site.js" defer></script>
</body>
</html>
